[project]
name = "llm-optmiser"
version = "0.1.0"
description = "Review and improve Bernard's Jev and Luna prompts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "braintrust>=0.42,<1",
    "dspy>=3.4.1,<3.5",
    "python-dotenv>=1,<2",
]

[project.scripts]
llm-optmiser = "llm_optimiser.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_optimiser"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
